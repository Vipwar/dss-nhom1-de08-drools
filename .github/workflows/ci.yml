name: Drools DSS Automated Verification & Unit Tests (24/24)

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  verify-drools-dss:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run 24 Unit & Integration Tests (DRL, Rete/PHREAK, TMS, V&V, CLIPS/Prolog, API)
        run: python -m unittest discover -s tests -v

      - name: Run CLI Walkthrough & Formal Knowledge Base V&V Verification
        run: python cli_demo.py
